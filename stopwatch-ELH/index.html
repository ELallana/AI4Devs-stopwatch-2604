<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        #counter {
            width: 280px;
            padding: 12px;
            font-size: 2rem;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin-bottom: 20px;
            font-family: monospace;
            background-color: #fafafa;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            min-width: 100px;
            transition: background-color 0.2s ease;
        }

        button:disabled {
            background-color: #999;
            cursor: not-allowed;
        }

        #startBtn.blue {
            background-color: #007bff;
        }

        #startBtn.green {
            background-color: #28a745;
        }

        #clearBtn {
            background-color: #dc3545;
        }
    </style>
</head>
<body>
    <div class="container">
        <input
            id="counter"
            type="text"
            value="00:00:00.000"
            readonly
        >

        <div class="buttons">
            <button id="startBtn" class="blue">Start</button>
            <button id="clearBtn">Clear</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
